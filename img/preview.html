<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ventix Apex · Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#ECEAE3;padding:40px;margin:0;color:#0B1F1B}
  h2{font-weight:700;letter-spacing:-0.02em;margin:24px 0 12px;font-size:14px;text-transform:uppercase;color:#4A5754;letter-spacing:0.1em}
  .row{display:flex;gap:32px;align-items:center;background:#FAFAF7;padding:24px;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row.dark{background:#0B1F1B;color:#FAFAF7}
  img{display:block}
  .label{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280;letter-spacing:.06em}
  .stack{display:flex;flex-direction:column;align-items:center;gap:8px}
</style></head><body>
<h2>App Icon — 512 × 512</h2>
<div class="row"><img src="ventix-app-icon-512.png" width="160"><div class="stack"><img src="ventix-app-icon-512.png" width="88"><span class="label">88px iOS</span></div><div class="stack"><img src="ventix-app-icon-512.png" width="48"><span class="label">48px Android</span></div></div>

<h2>App Icon — 192 × 192</h2>
<div class="row"><img src="ventix-app-icon-192.png" width="160"></div>

<h2>Favicon — 32 × 32 (real size)</h2>
<div class="row"><img src="ventix-favicon-32.png" width="32"><img src="ventix-favicon-32.png" width="64"><img src="ventix-favicon-32.png" width="128"></div>

<h2>Isotipo SVG — sidebar use</h2>
<div class="row"><img src="ventix-isotipo.svg" height="36"><img src="ventix-isotipo.svg" height="56"><img src="ventix-isotipo.svg" height="96"></div>
<div class="row dark"><img src="ventix-isotipo.svg" height="36"><img src="ventix-isotipo.svg" height="56"><img src="ventix-isotipo.svg" height="96"></div>

<h2>Imagotipo SVG — header (dark text)</h2>
<div class="row"><img src="ventix-imagotipo.svg" height="48"><img src="ventix-imagotipo.svg" height="72"></div>

<h2>Imagotipo SVG — header (white text, sobre dark)</h2>
<div class="row dark"><img src="ventix-imagotipo-white.svg" height="48"><img src="ventix-imagotipo-white.svg" height="72"></div>
</body></html>
